<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ server_name }}{% endblock %} &middot; ScorchDroid</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<header class="bar">
  <a class="brand" href="/">ScorchDroid<span>server admin</span></a>
  {% if show_nav %}
  <nav>
    <a href="/" class="{{ 'on' if page == 'dashboard' }}">Dashboard</a>
    <a href="/settings" class="{{ 'on' if page == 'settings' }}">Settings</a>
    <a href="/logs" class="{{ 'on' if page == 'logs' }}">Logs</a>
  </nav>
  <form method="post" action="/logout" class="inline"><button class="quiet">Sign out</button></form>
  {% endif %}
</header>

<main>
  {% if notice %}<p class="flash notice">{{ notice }}</p>{% endif %}
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
