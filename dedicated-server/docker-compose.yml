# A ScorchDroid dedicated server, in two containers.
#
# This file is self-contained: download it on its own, put an ADMIN_PASSWORD
# beside it, and run it. There is nothing to clone - the build context is the
# GitHub repository itself, submodules and all, fetched by the builder.
#
#   mkdir scorchdroid && cd scorchdroid
#   curl -O https://raw.githubusercontent.com/roge-rm/ScorchDroid/master/dedicated-server/docker-compose.yml
#   echo 'ADMIN_PASSWORD=pick-something' > .env
#   docker compose up -d --build
#
# Then open http://<this machine>:8080. The first build compiles the engine
# and takes a few minutes; after that it is cached.
#
#   server  - the game itself, the same engine the phone runs, listening on
#             27270 for ScorchDroid and desktop Scorched3D 44.3 clients.
#   web     - a browser admin page: settings, players, chat, logs, restart.
#
# Full documentation:
#   https://github.com/roge-rm/ScorchDroid/blob/master/dedicated-server/README.md

name: scorchdroid

services:
  server:
    build:
      # The repository is the context. Change the fragment after # to pin a
      # tag or a commit instead of tracking the default branch.
      context: https://github.com/roge-rm/ScorchDroid.git
      dockerfile: docker/server.Dockerfile
    image: scorchdroid-server
    container_name: scorchdroid-server
    # Host networking is what lets a phone find this server by itself: the
    # web container publishes the same `_scorchdroid._tcp.` mDNS service an
    # Android host publishes, and multicast cannot cross a Docker bridge.
    # It also means the ports are taken on the host directly rather than
    # published. See "Docker Desktop, and bridge networking" in the README
    # for the other way round.
    network_mode: host
    restart: unless-stopped
    environment:
      SCORCHDROID_PORT: "${GAME_PORT:-27270}"
      SCORCHDROID_SERVER_NAME: "${SERVER_NAME:-ScorchDroid}"
    volumes:
      # Settings, ban list and saved games. Back this up and you have the
      # server; delete it and the next start writes a fresh, fully
      # commented config with upstream's defaults.
      - config:/config
      # The control socket the web admin talks to. Never on the network.
      - control:/run/scorchdroid
      # Extra mods, if you have any. A mod is a directory of its own under
      # globalmods; drop one in, then pick it on the Settings page.
      # - ./mods/mymod:/opt/scorchdroid/data/globalmods/mymod:ro

  web:
    build:
      context: https://github.com/roge-rm/ScorchDroid.git
      dockerfile: docker/web.Dockerfile
    image: scorchdroid-web
    container_name: scorchdroid-web
    network_mode: host
    restart: unless-stopped
    depends_on:
      - server
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set - put it in a .env file beside this one}"
      SERVER_NAME: "${SERVER_NAME:-ScorchDroid}"
      GAME_PORT: "${GAME_PORT:-27270}"
      WEB_PORT: "${WEB_PORT:-8080}"
      WEB_BIND: "${WEB_BIND:-0.0.0.0}"
      LAN_DISCOVERY: "${LAN_DISCOVERY:-1}"
      # Set to 1 only when something in front of this terminates TLS -
      # otherwise the session cookie is marked Secure and never comes back.
      HTTPS: "${HTTPS:-0}"
    volumes:
      - control:/run/scorchdroid

volumes:
  config:
  control:
